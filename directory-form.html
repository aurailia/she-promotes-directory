<style>
:root {
    --plum-deep: #2a1028;
    --plum: #3d1a3a;
    --plum-soft: #52264e;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(232, 196, 122, 0.25);
    --gold: #e8c47a;
    --gold-bright: #f3d89b;
    --blush: #f4b6c8;
    --text: #fbeff3;
    --muted: #d8bfd0;
    --error: #ffb4b4;
    --title-grad: linear-gradient(100deg, #c49bff 0%, #e3a6f0 45%, #f4b6c8 100%);

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--plum-deep);
    background-image: linear-gradient(180deg, var(--plum-soft) 0%, var(--plum) 28%, var(--plum-deep) 100%);

    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: var(--gold-bright); }
  button, input, textarea { font-family: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, .pick:focus-within { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  .grad { background: var(--title-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--blush); width: fit-content; max-width: 100%; }

  .preview-note { background: rgba(232, 196, 122, 0.14); color: var(--gold-bright); font-size: 13px; text-align: center; padding: 8px 16px; }
  .wrap { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 20px 72px; }
  .brand { font-family: var(--serif); font-size: 24px; font-weight: 600; text-align: center; padding-top: 28px; margin: 0 auto; }
  .brand span { font-style: italic; }
  .brand-sub { text-align: center; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-top: 2px; }

  .progress { margin: 26px 0 30px; }
  .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .bars i { display: block; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); }
  .bars i.on { background: linear-gradient(90deg, var(--gold), var(--blush)); }
  .progress-label { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }

  .step-title { font-family: var(--serif); font-size: 46px; font-weight: 600; line-height: 1.08; padding-bottom: 3px; outline: none; }
  .step-sub { margin-top: 10px; font-size: 16px; color: var(--muted); }
  .form-body { margin-top: 28px; }

  .field { margin-top: 24px; }
  .field:first-child { margin-top: 0; }
  .field label, .field .label { display: block; font-size: 15px; font-weight: 600; }
  .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
  .help { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  input[type=text], input[type=email], input[type=url], textarea {
    display: block; width: 100%; margin-top: 8px; padding: 13px 15px; min-height: 50px;
    background: #fff9fb; color: #2a1028; border: 1px solid transparent; border-radius: 12px;
    font-size: 16px; line-height: 1.5;
  }
  textarea { resize: vertical; min-height: 118px; }
  textarea.tall { min-height: 200px; }
  textarea.short { min-height: 84px; }
  input::placeholder, textarea::placeholder { color: #8d7288; }
  .invalid input, .invalid textarea { border-color: var(--error); box-shadow: 0 0 0 1px var(--error); }
  .err { font-size: 13.5px; color: var(--error); margin-top: 6px; font-weight: 500; }
  .count { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }

  .pick { display: block; margin-top: 8px; border: 1px dashed rgba(232, 196, 122, 0.55); border-radius: 14px; background: var(--card); cursor: pointer; overflow: hidden; position: relative; }
  .pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .pick-empty { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 28px 16px; text-align: center; }
  .pick-empty b { color: var(--gold-bright); font-weight: 600; font-size: 15px; }
  .pick-empty small { color: var(--muted); font-size: 13px; }
  .pick-img { display: block; width: 100%; aspect-ratio: 16 / 7; object-fit: cover; }
  .pick.round { width: 164px; border-radius: 50%; aspect-ratio: 1; }
  .pick.round .pick-empty { height: 100%; justify-content: center; padding: 12px; }
  .pick.round .pick-img { aspect-ratio: 1; height: 100%; }
  .pick-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
  .link-btn { background: none; border: none; color: var(--gold-bright); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0; }
  .busy-note { font-size: 13.5px; color: var(--muted); margin-top: 6px; }

  .group { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 24px 22px; margin-top: 18px; }
  .group:first-child { margin-top: 0; }
  .group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }

  .add { width: 100%; margin-top: 16px; }
  .tier-note { margin-top: 10px; color: var(--gold-bright); }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 12px 26px; border-radius: 999px; font-size: 15px; font-weight: 600; line-height: 1.25; text-decoration: none; cursor: pointer; border: 1px solid transparent; text-align: center; }
  .btn:active { transform: scale(0.98); }
  .btn[disabled] { opacity: 0.6; cursor: wait; }
  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--blush)); color: var(--plum-deep); }
  .btn-ghost { background: transparent; color: var(--text); border-color: rgba(216, 191, 208, 0.4); }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; }
  .nav .btn-primary { flex: 1 1 auto; max-width: 340px; margin-left: auto; }
  .saved-note { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .form-error { background: rgba(255, 120, 120, 0.13); border: 1px solid rgba(255, 180, 180, 0.5); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; margin-top: 20px; }

  .ready { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 20px; margin-bottom: 26px; font-size: 14.5px; }
  .ready b { color: var(--gold-bright); }
  .ready ul { list-style: none; margin-top: 8px; }
  .ready li { padding-left: 20px; position: relative; margin-top: 4px; }
  .ready li::before { content: "\2726"; position: absolute; left: 0; color: var(--gold); font-size: 12px; top: 2px; }

  .rev { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 20px; margin-top: 14px; }
  .rev-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .rev-head h2 { font-family: var(--serif); font-size: 25px; font-weight: 600; color: var(--gold-bright); line-height: 1.2; }
  .rev dl { margin-top: 6px; }
  .rev dt { font-size: 12.5px; color: var(--blush); font-weight: 600; margin-top: 10px; }
  .rev dd { font-size: 15px; white-space: pre-line; overflow-wrap: anywhere; }
  .rev img { display: block; max-width: 180px; max-height: 110px; border-radius: 10px; margin-top: 4px; object-fit: cover; }
  .rev .none { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .consent { display: flex; gap: 12px; align-items: flex-start; margin-top: 24px; font-size: 15px; cursor: pointer; }
  .consent input { width: 22px; height: 22px; flex: 0 0 22px; margin-top: 2px; accent-color: var(--gold); }

  .done { text-align: center; padding-top: 56px; }
  .done h1 { font-family: var(--serif); font-size: 54px; font-weight: 600; line-height: 1.06; margin: 0 auto; padding-bottom: 3px; }
  .done p { margin: 14px auto 0; max-width: 500px; font-size: 16.5px; }
  .edit-box { max-width: 520px; margin: 24px auto 0; background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px 18px; font-size: 14.5px; }
  .edit-box code { display: block; margin-top: 8px; font-family: inherit; overflow-wrap: anywhere; color: var(--gold-bright); font-size: 13px; }
  .signoff { margin-top: 28px !important; color: var(--muted); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .center-msg { text-align: center; padding: 60px 0; color: var(--muted); }

  @media (max-width: 600px) {
    .wrap { padding: 0 16px 56px; }
    .step-title { font-size: 38px; }
    .group { padding: 20px 16px; }
    .done h1 { font-size: 44px; }
    .nav .btn-primary { max-width: none; }
  }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .opt-btn { border: 1px solid var(--card-border); background: var(--card); color: var(--text, #f6e9ef); border-radius: 999px; padding: 10px 16px; font-size: 14.5px; min-height: 44px; cursor: pointer; text-align: left; }
  .opt-btn.on { background: var(--gold); border-color: var(--gold); color: var(--plum-deep); font-weight: 600; }
  .opts.many .opt-btn { font-size: 13.5px; padding: 8px 13px; min-height: 40px; }
  .divider-space { height: 22px; }
</style>

    } },

    photo: { label: 'A photo of you, or your logo', type: 'image', required: true, shape: 'round', size: 900, help: 'A clear photo of your face works best. Faces get remembered.' },

    clink: { label: 'Link to join', type: 'url', gr: true, ph: 'https://www.skool.com/your-community/about' },
    cabout: { label: 'Your community in one sentence', type: 'textarea', short: true, max: 200, gr: true },

    cdays: { label: 'Which days can people promote?', type: 'days', optional: true, showIf: function () { return val('cpromo') === 'Yes'; } },
    cbanner: { label: 'Community banner', type: 'image', optional: true, size: 1400, help: 'Your Skool community banner works great.' },
    c2has: { label: 'Do you run another community?', type: 'choice', options: ['No', 'Yes'], optional: true },

    c2access: { label: 'Free or paid?', type: 'choice', options: ['Free', 'Paid', 'Free with a paid upgrade'], optional: true, showIf: function () { return val('c2has') === 'Yes'; } }
  };

    F['o' + n + 'link'] = { label: 'Link to your offer', type: 'url', gr: true, ph: 'yourwebsite.com/offer' };

    F['o' + n + 'format'] = { label: 'What kind of offer is it?', type: 'multi', options: FORMATS, maxPick: 3, optional: true };
    F['o' + n + 'keys'] = { label: 'Search words', optional: true, help: 'Up to 10, separated by commas. Words someone would type to find you.', ph: 'money blocks, pricing, abundance' };
    F['o' + n + 'image'] = { label: 'Offer image', type: 'image', optional: true, size: 1400, help: 'A wide image of your offer looks great on its card.' };
    F['r' + n + 'name'] = { label: 'Community name', gr: true };
    F['r' + n + 'link'] = { label: 'Link to join (your affiliate link is great)', type: 'url', gr: true };
    F['r' + n + 'about'] = { label: 'What it is, in one sentence', type: 'textarea', short: true, max: 200, optional: true };

    F['r' + n + 'access'] = { label: 'Free or paid?', type: 'choice', options: ['Free', 'Paid', 'Free with a paid upgrade'], optional: true };
    F['r' + n + 'days'] = { label: 'Which days can people promote there?', type: 'days', optional: true, showIf: (function (k) { return function () { return val(k) === 'Promo Group'; }; })('r' + n + 'cat') };
    F['r' + n + 'why'] = { label: 'Why you recommend it', type: 'textarea', short: true, max: 300, gr: true, ph: 'This is where I learned to price my candles so I actually get paid.' };
    F['r' + n + 'aff'] = { label: 'Is that an affiliate link?', type: 'choice', options: ['No', 'Yes'], gr: true, help: 'We always let people know when a link pays you a fee.' };
  }
  var OFFER_SFX = ['title', 'desc', 'who', 'price', 'link', 'cat', 'format', 'keys', 'image'];
  var REC_SFX = ['name', 'link', 'about', 'cat', 'access', 'days', 'why', 'aff'];
  var IMAGE_KEYS = ['photo', 'vcover', 'cbanner', 'o1image', 'o2image', 'o3image'];

    { id: 'you', nav: 'You', title: 'Let\'s start with you', sub: 'This is how people meet you in the Directory.', keys: ['tier', 'name', 'email', 'skool', 'business', 'photo', 'about', 'social'] },

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    S.a[k] = v;

  function okUrl(v) { return /^https?:\/\/[^\s/]+\.[^\s]+$/i.test(v); }
  function saveDraft() { if (S.token) return; try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ a: S.a, offers: S.offers, recs: S.recs, step: S.step })); } catch (e) { /* fine */ } }

    try {
      var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (d && d.a) { S.a = d.a; S.offers = Math.min(Math.max(d.offers || 1, 1), 3); S.recs = Math.min(Math.max(d.recs || 0, 0), 3); S.step = Math.max(0, d.step || 0); }

    var errs = validate();
    if (Object.keys(errs).length) { showErrors(errs); return; }
    S.errors = {}; S.formError = '';
    if (S.step === steps().length - 1) { submit(); return; }
    S.step++; saveDraft(); render(true);
  });

  /* ---------- start ---------- */
  document.getElementById('previewNote').hidden = LIVE;
  var token = '';
  try { token = new URLSearchParams(location.search).get('edit') || ''; } catch (e) { token = ''; }
  if (token && LIVE) {
    app.innerHTML = '<div class="center-msg">Getting your answers...</div>';
    fetch(SCRIPT_URL + '?action=load&token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res || !res.ok) throw new Error('nf'); S.token = token; unpack(res.answers || {}, res.images || {}); render(true); })
      .catch(function () { app.innerHTML = '<div class="center-msg">I couldn\'t find your answers with that link. Please email team@aurailia.com and I\'ll help you.</div>'; });
  } else { loadDraft(); render(false); }
  window.__shePromotesForm = { unpack: unpack, payload: payload, S: S };
})();
</script>
