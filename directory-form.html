:root {

  .done-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }

    render(true);
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (S.sending || S.busy) return;
    var errs = validate();
    if (Object.keys(errs).length) { showErrors(errs); return; }
    S.errors = {}; S.formError = '';
    if (S.step === steps().length - 1) { submit(); return; }
    S.aiOpen = false; S.aiNote = ''; S.aiText = ''; S.aiCopied = false;
    S.step++; S.hadDraft = false; S.freshConfirm = false; saveDraft(); render(true);
  });

  /* ---------- start ---------- */
  document.getElementById('previewNote').hidden = LIVE;
  var token = '';
  try { token = new URLSearchParams(location.search).get('edit') || ''; } catch (e) { token = ''; }
  if (token && LIVE) {
    app.innerHTML = '<div class="center-msg">Getting your answers...</div>';
    fetch(SCRIPT_URL + '?action=load&token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) throw new Error('nf');
        S.token = token;
        var ans = res.answers || {}, imgs = res.images || {};
        var done = function () { unpack(ans, imgs); render(true); };
        fetch(DIRECTORY_URL + 'directory.json?fresh=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) { try { liveOverlay(ans, imgs, data); } catch (e) { /* use the Sheet */ } done(); })
          .catch(done);
      })
      .catch(function () { app.innerHTML = '<div class="center-msg">I couldn\'t find your answers with that link. Please email team@aurailia.com and I\'ll help you.</div>'; });
  } else {
    loadDraft();
    var share = '';
    try { share = new URLSearchParams(location.search).get('share') || ''; } catch (e) { share = ''; }
    if (share === 'event') { S.a.want = WANT_EVENT; S.step = 0; }
    if (val('want') === WANT_EVENT && !has('etz')) S.a.etz = myTz;
    render(false);
  }
  window.__shePromotesForm = { unpack: unpack, liveOverlay: liveOverlay, render: render, payload: payload, eventPayload: eventPayload, S: S };
})();
</script>
</body>
