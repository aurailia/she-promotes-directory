<style>
:root {

    --plum: #3d1a3a;
    --plum-soft: #52264e;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(232, 196, 122, 0.25);
    --gold: #e8c47a;
    --gold-bright: #f3d89b;
    --blush: #f4b6c8;
    --text: #fbeff3;
    --muted: #d8bfd0;
    --error: #ffb4b4;
    --title-grad: linear-gradient(100deg, #c49bff 0%, #e3a6f0 45%, #f4b6c8 100%);

  [hidden] { display: none !important; }
  body {

  .wrap { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 20px 72px; }
  .brand { font-family: var(--serif); font-size: 24px; font-weight: 600; text-align: center; padding-top: 28px; margin: 0 auto; }
  .brand span { font-style: italic; }
  .brand-sub { text-align: center; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-top: 2px; }

  .progress { margin: 26px 0 30px; }
  .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .bars i { display: block; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); }
  .bars i.on { background: linear-gradient(90deg, var(--gold), var(--blush)); }
  .progress-label { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }

  .step-title { font-family: var(--serif); font-size: 46px; font-weight: 600; line-height: 1.08; padding-bottom: 3px; outline: none; }
  .step-sub { margin-top: 10px; font-size: 16px; color: var(--muted); }
  .form-body { margin-top: 28px; }

  .field { margin-top: 24px; }
  .field:first-child { margin-top: 0; }
  .field label, .field .label { display: block; font-size: 15px; font-weight: 600; }
  .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
  .help { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  input[type=text], input[type=email], input[type=url], input[type=date], input[type=time], select, textarea {

    background: #fff9fb; color: #2a1028; border: 1px solid transparent; border-radius: 12px;

  textarea { resize: vertical; min-height: 118px; }

  select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, #6d3a5f 50%), linear-gradient(135deg, #6d3a5f 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
  input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; }

  .count { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }

  .pick { display: block; margin-top: 8px; border: 1px dashed rgba(232, 196, 122, 0.55); border-radius: 14px; background: var(--card); cursor: pointer; overflow: hidden; position: relative; }

  .pick-empty small { color: var(--muted); font-size: 13px; }

  .opt-groups { display: grid; gap: 14px; margin-top: 4px; }
  .opt-group-t { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 7px; }
  .fresh-bar .btn-sm { padding: 8px 14px; font-size: 13px; min-height: 0; }

  .pick-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
  .link-btn { background: none; border: none; color: var(--gold-bright); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0; }

  .group { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 24px 22px; margin-top: 18px; }
  .group:first-child { margin-top: 0; }

  .group-head h2 { font-family: var(--serif); font-size: 27px; font-weight: 600; color: var(--gold-bright); line-height: 1.15; }
  .add { width: 100%; margin-top: 16px; }
  .tier-note { margin-top: 10px; color: var(--gold-bright); }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 12px 26px; border-radius: 999px; font-size: 15px; font-weight: 600; line-height: 1.25; text-decoration: none; cursor: pointer; border: 1px solid transparent; text-align: center; }
  .btn:active { transform: scale(0.98); }

  .nav .btn-primary { flex: 1 1 auto; max-width: 340px; margin-left: auto; }

  .form-error { background: rgba(255, 120, 120, 0.13); border: 1px solid rgba(255, 180, 180, 0.5); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; margin-top: 20px; }

  .ready { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 20px; margin-bottom: 26px; font-size: 14.5px; }

  .ready li { padding-left: 20px; position: relative; margin-top: 4px; }
  .ready li::before { content: "\2726"; position: absolute; left: 0; color: var(--gold); font-size: 12px; top: 2px; }

  .rev { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 20px; margin-top: 14px; }
  .rev-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .rev-head h2 { font-family: var(--serif); font-size: 25px; font-weight: 600; color: var(--gold-bright); line-height: 1.2; }
  .rev dl { margin-top: 6px; }

  .rev img { display: block; max-width: 180px; max-height: 110px; border-radius: 10px; margin-top: 4px; object-fit: cover; }

  .consent { display: flex; gap: 12px; align-items: flex-start; margin-top: 24px; font-size: 15px; cursor: pointer; }
  .consent input { width: 22px; height: 22px; flex: 0 0 22px; margin-top: 2px; accent-color: var(--gold); }

  .done { text-align: center; padding-top: 56px; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .center-msg { text-align: center; padding: 60px 0; color: var(--muted); }

  .ai-box.ai-first { border-width: 2px; border-color: rgba(232, 196, 122, 0.75); padding: 24px 22px 22px; box-shadow: 0 18px 40px -22px rgba(232, 196, 122, 0.55); }
  .ai-badge { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--plum-deep, #2a1028); background: linear-gradient(90deg, var(--gold), var(--blush)); border-radius: 999px; padding: 5px 12px; margin-bottom: 10px; }
  .ai-mode { display: grid; gap: 8px; margin-top: 14px; }
  .ai-mode-q { font-weight: 600; color: var(--text); }
  .ai-mode-btn { display: grid; gap: 2px; text-align: left; font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
  .ai-mode-btn span { font-size: 13.5px; color: var(--muted); }
  .ai-mode-btn.on { border-color: var(--gold); background: rgba(232, 196, 122, 0.12); }
  .ai-mode-btn.on b { color: var(--gold-bright); }
  .ai-or { display: flex; align-items: center; gap: 12px; margin: 4px 0 22px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; }
  .ai-or::before, .ai-or::after { content: ""; flex: 1; height: 1px; background: rgba(232, 196, 122, 0.3); }
  .ai-box h2 { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--gold-bright); line-height: 1.15; }
  .ai-box p { font-size: 14.5px; margin-top: 6px; }
  .ai-box ol { margin: 12px 0 0 20px; font-size: 14.5px; }
  .ai-box ol li { margin-top: 6px; padding-left: 4px; }
  .ai-box .ai-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .ai-box .btn { flex: 1 1 180px; }
  .ai-box textarea { min-height: 120px; font-size: 14px; }
  .ai-box .ai-note { margin-top: 10px; font-size: 14px; color: var(--gold-bright); }

  .ai-prompt { margin-top: 12px; width: 100%; min-height: 160px; font-size: 13px; }
  .ai-open { margin-top: 12px; }
  .done-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
  .done-actions .btn { flex: 0 0 auto; text-decoration: none; padding-left: 26px; padding-right: 26px; }
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  /* Your Directory stats, on your edit page */
  #statsBox { margin: 6px 0 26px; border: 1px solid rgba(232, 196, 122, 0.35); border-radius: 20px; padding: 18px 18px 16px; background: linear-gradient(180deg, rgba(232, 196, 122, 0.07), rgba(255, 255, 255, 0.02)); }
  #statsBox summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; color: var(--gold-bright); }
  #statsBox summary::-webkit-details-marker { display: none; }
  #statsBox summary .tog { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; color: var(--gold); }
  #statsBox.later { display: none; }
  .st-note { font-size: 13px; opacity: 0.8; margin: 6px 0 12px; }
  .st-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .st-tile { border-radius: 14px; background: rgba(255, 255, 255, 0.05); padding: 12px 14px; }
  .st-tile b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; line-height: 1.1; color: var(--gold-bright); }
  .st-tile span { font-size: 13px; opacity: 0.85; }
  .st-tile small { display: block; font-size: 12px; opacity: 0.6; margin-top: 2px; }
  .st-h { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 18px 0 8px; }
  .st-top { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 14px; }
  .st-top li { display: flex; justify-content: space-between; gap: 12px; }
</style>

      if (vc) { if (vc.inside && vc.inside.length) ans.vinside = vc.inside.join('\n'); set('vaccess', vc.access); }
      img('vcover', v.banner); img('vthumb', v.thumb);
    }
    return true;
  }
  /* bring saved answers back into the form */
  function unpack(ans, imgs) {
    var st = {}; try { st = JSON.parse(ans.formState || '{}'); } catch (e) { st = {}; }
    var a = {}, i, j = 1;
    ['name', 'email', 'skool', 'tier', 'business', 'about', 'social', 'website', 'sfacebook', 'stiktok', 'syoutube', 'slinkedin', 'spinterest', 'cname', 'clink', 'cabout', 'cplatform', 'caccess', 'cref', 'crefrate', 'crefhow', 'vheadline', 'vstory', 'vwho', 'vwebsite', 'vvideo', 'vinside', 'vaccess'].forEach(function (k) { a[k] = ans[k] || ''; });
    if (!a.website && ans.vwebsite) a.website = ans.vwebsite;
    var list = function (v) { return String(v || '').split(/\s*[,;]\s*/).filter(Boolean); };
    /* match whole names, since some categories have a comma in them */
    var pick = function (v, opts) { var c = String(v || '').toLowerCase(); return opts.filter(function (o) { return c.indexOf(o.toLowerCase()) !== -1; }).sort(function (x, y) { return c.indexOf(x.toLowerCase()) - c.indexOf(y.toLowerCase()); }); };
    a.ccat = pick(ans.ccat, COMM_CATS).slice(0, 4); a.cmbiz = ans.cmbiz || ''; a.cdays = list(ans.cdays); a.cpromo = st.cpromo || (a.cdays.length ? 'Yes' : '');
    for (i = 1; i <= 3; i++) OFFER_SFX.forEach(function (s) { if (s === 'image') return; a['o' + i + s] = s === 'cat' ? pick(ans['o' + i + s], CATEGORIES) : s === 'format' ? pick(ans['o' + i + s], FORMATS) : (ans['o' + i + s] || ''); });
    var offers = 0; for (i = 1; i <= 3; i++) if (a['o' + i + 'title'] || a['o' + i + 'desc']) offers = i;
    S.existing = imgs || {};
    a.clvshow = ans.clevels ? 'Yes' : (st.clvshow || ''); setLevels('clevels', parseLevels(ans.clevels), a);
    /* her other communities: their own columns, or the older way, where they sat in a recommendation spot */
    var owns = [], seenO = {}, nk = function (x) { return String(x || '').toLowerCase().replace(/\/+$/, '').trim(); };
    var addOwn = function (o) { var key = nk(o.link) || nk(o.name); if (!o.name || seenO[key] || key === nk(ans.clink)) return; seenO[key] = true; owns.push(o); };
    OWN_N.forEach(function (n) { var P = 'c' + n; if (ans[P + 'name']) addOwn({ name: ans[P + 'name'], link: ans[P + 'link'], about: ans[P + 'about'], cat: ans[P + 'cat'], mbiz: ans[P + 'mbiz'] || '', inside: ans[P + 'inside'] || '', access: ans[P + 'access'], levels: ans[P + 'levels'], ref: ans[P + 'ref'] || '', refrate: ans[P + 'refrate'] || '', refhow: ans[P + 'refhow'] || '', image: S.existing[P + 'banner'] }); });
    for (i = 1; i <= 3; i++) if (ans['r' + i + 'own'] === 'Yes' && ans['r' + i + 'name']) addOwn({ name: ans['r' + i + 'name'], link: ans['r' + i + 'link'], about: ans['r' + i + 'about'], cat: ans['r' + i + 'cat'], access: ans['r' + i + 'access'], levels: '', image: S.existing['r' + i + 'image'] });
    var oldR = {}; for (i = 1; i <= 3; i++) oldR[i] = S.existing['r' + i + 'image'];
    OWN_N.forEach(function (n) { var P = 'c' + n; delete S.existing[P + 'banner']; });
    owns.slice(0, 3).forEach(function (o, x) {
      var P = 'c' + (x + 2);
      a[P + 'has'] = 'Yes'; a[P + 'name'] = o.name; a[P + 'link'] = o.link || ''; a[P + 'about'] = o.about || ''; a[P + 'access'] = o.access || ''; a[P + 'cat'] = pick(o.cat, COMM_CATS).slice(0, 4); a[P + 'mbiz'] = o.mbiz || ''; a[P + 'inside'] = o.inside || '';
      a[P + 'ref'] = o.ref || ''; a[P + 'refrate'] = o.refrate || ''; a[P + 'refhow'] = o.refhow || '';
      a[P + 'lvshow'] = o.levels ? 'Yes' : (st[P + 'lvshow'] || ''); setLevels(P + 'levels', parseLevels(o.levels), a);
      if (o.image) S.existing[P + 'banner'] = o.image;
    });
    if (owns.length < 3) a['c' + (owns.length + 2) + 'has'] = owns.length || st.c2has === 'No' ? 'No' : '';
    var recs = 0;
    for (i = 1; j <= 3; j++) {
      if (!ans['r' + j + 'name'] || ans['r' + j + 'own'] === 'Yes') continue;
      REC_SFX.forEach(function (s) { if (s !== 'image') a['r' + i + s] = s === 'days' ? list(ans['r' + j + s]) : (ans['r' + j + s] || ''); });
      if (oldR[j]) S.existing['r' + i + 'image'] = oldR[j]; else delete S.existing['r' + i + 'image'];
      recs = i; i++;
    }
    S.a = a; S.offers = offers; S.recs = recs; S.refConsent = ans.refok === 'Yes';
  }

  /* ---------- events ---------- */
  app.addEventListener('input', function (e) {
    if (e.target.id === 'aiPaste') { S.aiText = e.target.value; return; }
    var k = e.target.getAttribute('data-a'); if (!k) return;
    S.a[k] = e.target.value;
    var c = app.querySelector('[data-count="' + k + '"]'); if (c) c.textContent = e.target.value.length + ' / ' + F[k].max;
    saveDraft();
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'consent' || e.target.id === 'affConsent' || e.target.id === 'refConsent') {
      var ek = e.target.id === 'consent' ? 'consent' : e.target.id === 'refConsent' ? 'refok' : 'aff';
      if (ek === 'consent') S.consent = e.target.checked; else if (ek === 'refok') S.refConsent = e.target.checked; else S.affConsent = e.target.checked;
      if (e.target.checked && S.errors[ek]) { delete S.errors[ek]; var row = e.target.closest('.field'); if (row) { row.classList.remove('invalid'); var m = row.querySelector('.err'); if (m) m.remove(); } }
      return;
    }
    var k = e.target.getAttribute('data-image');
    if (!k || !e.target.files || !e.target.files[0]) return;
    S.busy++; delete S.errors[k]; render(false);
    readImage(e.target.files[0], F[k].size || 1400, function (img) { S.images[k] = img; S.busy--; render(false); }, function () { S.busy--; S.errors[k] = 'I couldn\'t open that image. Please try a JPG or PNG.'; render(false); });
  });
  app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.id === 'doneEvent' || t.id === 'doneAnother') { startEvent(); return; }
    if (t.id === 'doneCollab') { startCollab(); return; }
    if (t.getAttribute('data-aimode')) { S.aiMode = t.getAttribute('data-aimode'); S.aiCopied = false; var ym = window.pageYOffset; render(false); window.scrollTo(0, ym); return; }
    if (t.id === 'aiToggle') { S.aiOpen = true; render(false); var bx = app.querySelector('.ai-box'); if (bx) bx.scrollIntoView({ block: 'start' }); return; }
    if (t.id === 'aiCopy') {
      copyText(promptText(), function () { S.aiCopied = true; S.aiShowPrompt = false; var y0 = window.pageYOffset; render(false); window.scrollTo(0, y0); },
        function () { S.aiShowPrompt = true; var y1 = window.pageYOffset; render(false); window.scrollTo(0, y1); var pb = document.getElementById('aiPromptBox'); if (pb) { pb.focus(); pb.select(); } S.aiNote = 'Copy the prompt from the box above.'; });
      return;
    }
    if (t.id === 'aiFill') {
      var pj = pickJson(S.aiText);
      if (!pj) { S.aiBad = true; S.aiNote = 'I couldn\'t read that. Paste the whole answer, including the part in curly brackets.'; }
      else {
        var got = aiKind() === 'vip' ? aiFillVip(pj) : aiFill(pj); saveDraft();
        S.aiBad = !got;
        S.aiNote = got ? (aiKind() === 'vip' ? 'Done. I filled in ' + got + ' answers below. Read them over and make sure it sounds like you, then add your cover image.' : 'Done. I filled in ' + got + ' answers. Tap Next to check each step, add your images, and make sure it sounds like you.') : 'That answer was empty. Add more about your business in the chat and try again.';
      }
      var y2 = window.pageYOffset; render(false); window.scrollTo(0, y2);
      return;
    }
    var pk = t.getAttribute('data-pick');
    if (pk) {
      var f = F[pk], v = t.getAttribute('data-v');
      if (f.type === 'choice') S.a[pk] = v;
      else {
        var arr = Array.isArray(S.a[pk]) ? S.a[pk].slice() : [];
        var at = arr.indexOf(v);
        if (at !== -1) arr.splice(at, 1);
        else if (f.maxPick === 1) arr = [v];
        else if (f.maxPick && arr.length >= f.maxPick) { S.errors[pk] = 'You can pick up to ' + f.maxPick + '. Tap one to unpick it first.'; render(false); return; }
        else arr.push(v);
        if (f.type === 'days') arr.sort(function (x, y) { return DAYS.indexOf(x) - DAYS.indexOf(y); });
        S.a[pk] = arr;
      }
      delete S.errors[pk];
      if (pk === 'want' && val('want') === WANT_EVENT && !has('etz')) S.a.etz = myTz;
      saveDraft();
      var y = window.pageYOffset; render(false); window.scrollTo(0, y);
      return;
    }
    if (t.id === 'backBtn') { S.aiOpen = false; S.aiNote = ''; S.aiText = ''; S.aiCopied = false; S.errors = {}; S.formError = ''; S.step--; saveDraft(); render(true); return; }
    var add = t.getAttribute('data-add');
    if (add) { if (add === 'o') S.offers++; else S.recs++; S.confirmRemove = ''; saveDraft(); render(false); return; }
    var rem = t.getAttribute('data-remove');
    if (rem) {
      if (S.confirmRemove !== rem) { S.confirmRemove = rem; render(false); return; }
      S.confirmRemove = ''; S.errors = {}; removeGroup(rem.charAt(0), +rem.slice(1)); saveDraft(); render(false); return;
    }
    var go = t.getAttribute('data-goto');
    if (go !== null) { S.errors = {}; S.formError = ''; S.step = +go; saveDraft(); render(true); return; }
    var rp = t.getAttribute('data-replace');
    if (rp) { var inp = app.querySelector('[data-image="' + rp + '"]'); if (inp) inp.click(); return; }
    var cl = t.getAttribute('data-clear');
    if (cl) { if (S.existing[cl]) { S.images[cl] = null; S.existing[cl] = ''; } else delete S.images[cl]; render(false); }
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('#freshStart') : null;
    if (!b) return;
    if (!S.freshConfirm) { S.freshConfirm = true; render(false); return; }
    clearDraft();
    S.a = {}; S.images = {}; S.existing = {}; S.offers = 1; S.recs = 0; S.step = 0; S.errors = {}; S.formError = '';
    S.hadDraft = false; S.freshConfirm = false; S.consent = false;
    render(true);
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (S.sending || S.busy) return;
    var errs = validate();
    if (Object.keys(errs).length) { showErrors(errs); return; }
    S.errors = {}; S.formError = '';
    if (S.step === steps().length - 1) { submit(); return; }
    S.aiOpen = false; S.aiNote = ''; S.aiText = ''; S.aiCopied = false;
    S.step++; S.hadDraft = false; S.freshConfirm = false; saveDraft(); render(true);
  });

  /* ---------- Your Directory stats ----------
     Clicks are being counted, but members don't see them yet. Switch this to true to show the stats box on their edit page. */
  var SHOW_MEMBER_STATS = false;
  /* You still see them: any browser where you've opened the Updater counts as yours */
  var isOwner = function () { try { return localStorage.getItem('spNoTrack') === '1'; } catch (e) { return false; } };
  function loadStats(tok) {
    if (!SHOW_MEMBER_STATS && !isOwner()) return;
    fetch(SCRIPT_URL + '?action=stats&token=' + encodeURIComponent(tok))
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res && res.ok) renderStats(res); })
      .catch(function () { /* stats are a bonus */ });
  }
  function renderStats(res) {
    var box = document.getElementById('statsBox');
    if (!res.stats) return;
    var L = res.labels || {}, h = '<details open><summary>Your Directory stats <span class="tog">Show or hide</span></summary>';
    h += '<p class="st-note">How many times people tapped on your listing. These are clicks, not sales.</p>';
    if (res.stats) {
      var order = ['profile', 'offer', 'community', 'rec', 'featured', 'refvisit', 'refjoin'];
      h += '<div class="st-tiles">';
      order.forEach(function (k) {
        var all = res.stats.all[k] || 0, rec = res.stats.recent[k] || 0;
        if (!all && (k === 'featured' || k === 'rec')) return;
        h += '<div class="st-tile"><b>' + rec + '</b><span>' + esc(L[k] || k) + '</span><small>last 30 days, ' + all + ' all time</small></div>';
      });
      h += '</div>';
      if (res.stats.top && res.stats.top.length) {
        var kn = { offer: 'Offer', community: 'Community', rec: 'Recommended' };
        h += '<div class="st-h">What people clicked most</div><ul class="st-top">';
        res.stats.top.forEach(function (t) { h += '<li><span>' + esc(t.what) + ' <small style="opacity:.6">' + esc(kn[t.kind] || '') + '</small></span><b>' + t.n + '</b></li>'; });
        h += '</ul>';
      }
    }
    h += '<p class="st-note" style="margin-top:14px">Want to see who joined through your link and what you earned? That lives in Skool: tap your profile picture, then Settings, then Affiliate.</p>';
    h += '</details>';
    box.innerHTML = h; box.hidden = false;
  }

  /* ---------- start ---------- */
  document.getElementById('previewNote').hidden = LIVE;
  var token = '';
  try { token = new URLSearchParams(location.search).get('edit') || ''; } catch (e) { token = ''; }
  if (token && LIVE) {
    app.innerHTML = '<div class="center-msg">Getting your answers...</div>';
    fetch(SCRIPT_URL + '?action=load&token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) throw new Error('nf');
        S.token = token;
        loadStats(token);
        var ans = res.answers || {}, imgs = res.images || {};
        var done = function () { unpack(ans, imgs); render(true); };
        fetch(DIRECTORY_URL + 'directory.json?fresh=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) { try { liveOverlay(ans, imgs, data); } catch (e) { /* use the Sheet */ } done(); })
          .catch(done);
      })
      .catch(function () { app.innerHTML = '<div class="center-msg">I couldn\'t find your answers with that link. Please email team@aurailia.com and I\'ll help you.</div>'; });
  } else {
    loadDraft();
    var share = '';
    try { share = new URLSearchParams(location.search).get('share') || ''; } catch (e) { share = ''; }
    if (share === 'event') { S.a.want = WANT_EVENT; S.step = 0; }
    if (share === 'collab') { S.a.want = WANT_COLLAB; S.step = 0; }
    if (val('want') === WANT_EVENT && !has('etz')) S.a.etz = myTz;
    render(false);
  }
  window.__shePromotesForm = { unpack: unpack, liveOverlay: liveOverlay, render: render, payload: payload, eventPayload: eventPayload, collabPayload: collabPayload, S: S };
})();
